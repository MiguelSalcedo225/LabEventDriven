apiVersion: v1
kind: ConfigMap
metadata:
  name: sms-service-config
  namespace: microservices
data:
  KAFKA_BROKER: "kafka:29092"
  SERVICE_NAME: "sms-service"
---
apiVersion: v1
kind: Service
metadata:
  name: sms-service
  namespace: microservices
  labels:
    app: sms-service
spec:
  type: ClusterIP
  ports:
  - port: 3008
    targetPort: 3008
    protocol: TCP
    name: http
  selector:
    app: sms-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-service
  namespace: microservices
  labels:
    app: sms-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sms-service
  template:
    metadata:
      labels:
        app: sms-service
    spec:
      containers:
      - name: sms-service
        image: sms-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3008
          name: http
        envFrom:
        - configMapRef:
            name: sms-service-config
        env:
        - name: PORT
          value: "3008"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 10
          periodSeconds: 5
